[project]
name = "support-rag-desk"
version = "0.1.0"
description = "Tenant-scoped support answers with citations and escalation"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
models = [
    "sentence-transformers>=5,<6",
]

[dependency-groups]
browser = ["playwright==1.64.1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
